<svg xmlns="http://www.w3.org/2000/svg" width="420" height="84" viewBox="0 0 420 84" fill="none">
<defs>
<linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E8C766"/><stop offset="1" stop-color="#C9A227"/></linearGradient>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#DAD5C6"/></pattern>
</defs>
<style>
text{font-family:'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif} .mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%{r:5;opacity:1}100%{r:16;opacity:0}}
@keyframes dash{to{stroke-dashoffset:-40}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.up{opacity:0;animation:up .9s cubic-bezier(.2,.7,.2,1) forwards}
.fade{opacity:0;animation:fade 1s ease forwards}
.flow{stroke-dasharray:6 8;animation:dash 1.2s linear infinite}

</style>
<rect x="2" y="2" width="416" height="80" rx="40" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2"/>
<text x="40" y="37" class="mono" font-size="11" fill="#6B6B6B" letter-spacing="2.5">PORTFÓLIO</text>
<text x="40" y="60" font-size="21" font-weight="700" fill="#0A0A0A" letter-spacing="1">cauaravaiano.com.br</text>
<text x="380" y="50" text-anchor="end" font-size="22" fill="#C9A227">→</text>
</svg>