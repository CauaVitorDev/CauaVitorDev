<text x="615" y="94.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0A0A0A">dá pra</text>
<text x="615" y="111.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0A0A0A">automatizar?</text></g>
<g class="up" style="animation-delay:0.4s">
