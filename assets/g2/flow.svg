<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" fill="none">
<defs>
<linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F0D27A"/><stop offset="1" stop-color="#D4AF37"/></linearGradient>
<linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1C1F26"/><stop offset="1" stop-color="#15171C"/></linearGradient>
<radialGradient id="glow" cx=".85" cy="0" r=".7"><stop offset="0" stop-color="#D4AF37" stop-opacity=".16"/><stop offset="1" stop-color="#D4AF37" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#262931"/></pattern>
</defs>
<style>
text{font-family:'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif} .mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%{r:5;opacity:1}100%{r:16;opacity:0}}
@keyframes dash{to{stroke-dashoffset:-40}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.up{opacity:0;animation:up .9s cubic-bezier(.2,.7,.2,1) forwards}
.fade{opacity:0;animation:fade 1s ease forwards}
.flow{stroke-dasharray:6 8;animation:dash 1.2s linear infinite}
</style>
<rect x="1" y="1" width="1198" height="298" rx="24" fill="url(#card)" stroke="#2A2D35" stroke-width="2"/><rect x="1" y="1" width="1198" height="298" rx="24" fill="url(#dots)" opacity=".7"/><rect x="1" y="1" width="1198" height="298" rx="24" fill="url(#glow)"/>
<path d="M220 98.0 H270" stroke="#4A4D55" stroke-width="2" class="flow"/>
<path d="M450 98.0 H540" stroke="#4A4D55" stroke-width="2" class="flow"/>
<path d="M690 98.0 H770" stroke="#4A4D55" stroke-width="2" class="flow"/>
<path d="M950 98.0 H990" stroke="#4A4D55" stroke-width="2" class="flow"/>
<text x="730.0" y="88.0" text-anchor="middle" class="mono" font-size="12" fill="#D4AF37">sim</text>
<path d="M615 140.0 V200" stroke="#4A4D55" stroke-width="2" class="flow"/>
<path d="M705 238 H860.0 V136" stroke="#4A4D55" stroke-width="2" class="flow"/>
<text x="625" y="168.0" class="mono" font-size="12" fill="#9CA0A8">ainda não</text>
<circle r="7" fill="#D4AF37"><animateMotion dur="4.5s" repeatCount="indefinite" path="M220 98.0 H990"/></circle>
<circle r="15" fill="#D4AF37" opacity=".22"><animateMotion dur="4.5s" repeatCount="indefinite" path="M220 98.0 H990"/></circle>
