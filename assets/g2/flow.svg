<text x="545" y="232" class="mono" font-size="12" fill="#D4AF37" letter-spacing="2">↳</text>
<text x="575" y="233" font-size="17" font-weight="700" fill="#F5F3EE" letter-spacing="2">CÓDIGO</text>
<text x="545" y="257" font-size="14" fill="#9CA0A8">sob medida</text></g>
</svg>