<animate attributeName="opacity" values="0;1;0" keyTimes="0;.1;.35" dur="4.5s" begin="2.9s" repeatCount="indefinite"/></rect>
<text x="790" y="92" class="mono" font-size="12" fill="#D4AF37" letter-spacing="2">03</text>
<text x="820" y="93" font-size="17" font-weight="700" fill="#F5F3EE" letter-spacing="2">WORKFLOW</text>
<text x="790" y="117" font-size="14" fill="#9CA0A8">API + IA</text></g>
<g class="up" style="animation-delay:0.5s">
<rect x="990" y="60" width="170" height="76" rx="16" fill="#0A0A0A" stroke="#D4AF37" stroke-width="1.5"/><rect x="990" y="60" width="170" height="76" rx="16" fill="none" stroke="#D4AF37" stroke-width="3" opacity="0">
<animate attributeName="opacity" values="0;1;0" keyTimes="0;.1;.35" dur="4.5s" begin="3.9s" repeatCount="indefinite"/></rect>
<text x="1010" y="92" class="mono" font-size="12" fill="#D4AF37" letter-spacing="2">04</text>
<text x="1040" y="93" font-size="17" font-weight="700" fill="#F5F3EE" letter-spacing="2">DONE</text>
<text x="1010" y="117" font-size="14" fill="#9CA0A8">roda sozinho</text></g>
<g class="up" style="animation-delay:0.6s">
