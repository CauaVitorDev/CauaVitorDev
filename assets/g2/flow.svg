<text x="320" y="93" font-size="17" font-weight="700" fill="#F5F3EE" letter-spacing="2">MAPEAR</text>
<text x="290" y="117" font-size="14" fill="#9CA0A8">entender o processo</text></g>
<g class="up" style="animation-delay:.3s">
