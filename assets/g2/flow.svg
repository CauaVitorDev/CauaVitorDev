<animate attributeName="opacity" values="0;1;0" keyTimes="0;.1;.35" dur="4.5s" begin="0s" repeatCount="indefinite"/></rect>
<text x="60" y="92" class="mono" font-size="12" fill="#D4AF37" letter-spacing="2">01</text>
<text x="90" y="93" font-size="17" font-weight="700" fill="#F5F3EE" letter-spacing="2">TRIGGER</text>
<text x="60" y="117" font-size="14" fill="#9CA0A8">tarefa repetitiva</text></g>
