<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" fill="none">
<defs>
<linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F0D27A"/><stop offset="1" stop-color="#D4AF37"/></linearGradient>
<linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1C1F26"/><stop offset="1" stop-color="#15171C"/></linearGradient>
<radialGradient id="glow" cx=".85" cy="0" r=".7"><stop offset="0" stop-color="#D4AF37" stop-opacity=".16"/><stop offset="1" stop-color="#D4AF37" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#262931"/></pattern>
</defs>
<style>
text{font-family:'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif} .mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%{r:5;opacity:1}100%{r:16;opacity:0}}
@keyframes dash{to{stroke-dashoffset:-40}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.up{opacity:0;animation:up .9s cubic-bezier(.2,.7,.2,1) forwards}
.fade{opacity:0;animation:fade 1s ease forwards}
.flow{stroke-dasharray:6 8;animation:dash 1.2s linear infinite}
</style>
<rect x="1" y="1" width="1198" height="458" rx="24" fill="url(#card)" stroke="#2A2D35" stroke-width="2"/><rect x="1" y="1" width="1198" height="458" rx="24" fill="url(#dots)" opacity=".7"/><rect x="1" y="1" width="1198" height="458" rx="24" fill="url(#glow)"/>
<text x="70" y="70" class="mono fade" font-size="14" fill="#9CA0A8" letter-spacing="2">WORKFLOW / caua-vitor.yml</text>
<g class="fade" style="animation-delay:.3s"><rect x="930" y="46" width="200" height="36" rx="18" fill="#0A0A0A" stroke="#2A2D35"/>
<circle cx="954" cy="64" r="5" fill="#D4AF37"/><circle cx="954" cy="64" r="5" fill="none" stroke="#D4AF37" style="animation:pulse 1.6s ease-out infinite"/>
<text x="970" y="69" class="mono" font-size="13" fill="#F5F3EE" letter-spacing="1.5">PUBLISHED · LIVE</text></g>
<text x="66" y="185" class="up" font-size="92" font-weight="800" fill="#F5F3EE" letter-spacing="-3" style="animation-delay:.15s">Cauã Vitor</text>
<rect x="70" y="208" width="120" height="4" fill="url(#gold)" style="transform-origin:70px 0;transform:scaleX(0);animation:grow .9s .6s cubic-bezier(.2,.7,.2,1) forwards"/>
<text x="210" y="216" class="up" font-size="17" font-weight="600" fill="#D4AF37" letter-spacing="6" style="animation-delay:.5s">AUTOMAÇÃO · INTELIGÊNCIA ARTIFICIAL · WORKFLOWS</text>
<path d="M270 338.0 H360" stroke="#4A4D55" stroke-width="2" class="flow"/>
<path d="M560 338.0 H650" stroke="#4A4D55" stroke-width="2" class="flow"/>
<path d="M850 338.0 H940" stroke="#4A4D55" stroke-width="2" class="flow"/>
<circle r="7" fill="#D4AF37"><animateMotion dur="4s" repeatCount="indefinite" path="M270 338.0 H940"/></circle>
<circle r="15" fill="#D4AF37" opacity=".22"><animateMotion dur="4s" repeatCount="indefinite" path="M270 338.0 H940"/></circle>
