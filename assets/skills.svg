<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" fill="none">
<defs>
<linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E8C766"/><stop offset="1" stop-color="#C9A227"/></linearGradient>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#DAD5C6"/></pattern>
</defs>
<style>
text{font-family:'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif} .mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%{r:5;opacity:1}100%{r:16;opacity:0}}
@keyframes dash{to{stroke-dashoffset:-40}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.up{opacity:0;animation:up .9s cubic-bezier(.2,.7,.2,1) forwards}
.fade{opacity:0;animation:fade 1s ease forwards}
.flow{stroke-dasharray:6 8;animation:dash 1.2s linear infinite}

</style>
<g class="up" style="animation-delay:0.10s">
<rect x="15" y="10" width="270" height="150" rx="18" fill="#FFFFFF" stroke="#E6E1D3" stroke-width="1.5"/>
<rect x="37" y="10" width="40" height="3" fill="url(#gold)"/>
<text x="37" y="48" class="mono" font-size="13" fill="#C9A227" letter-spacing="2">01</text>
<text x="37" y="82" font-size="19" font-weight="700" fill="#0A0A0A">Gatilhos &amp; Webhooks</text>
<text x="37" y="110" font-size="14" fill="#6B6B6B">formulários, eventos e APIs</text>
<text x="37" y="130" font-size="14" fill="#6B6B6B">disparando o fluxo na hora</text>
<circle cx="259" cy="42" r="4" fill="#C9A227"><animate attributeName="opacity" values=".15;1;.15" dur="3.2s" begin="0.0s" repeatCount="indefinite"/></circle></g>
<g class="up" style="animation-delay:0.19s">
<rect x="305" y="10" width="270" height="150" rx="18" fill="#0A0A0A" stroke="#0A0A0A" stroke-width="1.5"/>
<rect x="327" y="10" width="40" height="3" fill="url(#gold)"/>
<text x="327" y="48" class="mono" font-size="13" fill="#C9A227" letter-spacing="2">02</text>
<text x="327" y="82" font-size="19" font-weight="700" fill="#FFFFFF">IA no fluxo</text>
<text x="327" y="110" font-size="14" fill="#B5B5B5">classifica respostas e</text>
<text x="327" y="130" font-size="14" fill="#B5B5B5">decide o próximo passo</text>
<circle cx="549" cy="42" r="4" fill="#C9A227"><animate attributeName="opacity" values=".15;1;.15" dur="3.2s" begin="0.4s" repeatCount="indefinite"/></circle></g>
<g class="up" style="animation-delay:0.28s">
<rect x="595" y="10" width="270" height="150" rx="18" fill="#FFFFFF" stroke="#E6E1D3" stroke-width="1.5"/>
<rect x="617" y="10" width="40" height="3" fill="url(#gold)"/>
<text x="617" y="48" class="mono" font-size="13" fill="#C9A227" letter-spacing="2">03</text>
<text x="617" y="82" font-size="19" font-weight="700" fill="#0A0A0A">Integrações via API</text>
<text x="617" y="110" font-size="14" fill="#6B6B6B">sistemas conversando</text>
<text x="617" y="130" font-size="14" fill="#6B6B6B">sem copiar e colar</text>
<circle cx="839" cy="42" r="4" fill="#C9A227"><animate attributeName="opacity" values=".15;1;.15" dur="3.2s" begin="0.8s" repeatCount="indefinite"/></circle></g>
<g class="up" style="animation-delay:0.37s">
<rect x="885" y="10" width="270" height="150" rx="18" fill="#FFFFFF" stroke="#E6E1D3" stroke-width="1.5"/>
<rect x="907" y="10" width="40" height="3" fill="url(#gold)"/>
<text x="907" y="48" class="mono" font-size="13" fill="#C9A227" letter-spacing="2">04</text>
<text x="907" y="82" font-size="19" font-weight="700" fill="#0A0A0A">Follow-up multicanal</text>
<text x="907" y="110" font-size="14" fill="#6B6B6B">SMS, e-mail e WhatsApp</text>
<text x="907" y="130" font-size="14" fill="#6B6B6B">no momento certo</text>
<circle cx="1129" cy="42" r="4" fill="#C9A227"><animate attributeName="opacity" values=".15;1;.15" dur="3.2s" begin="1.2s" repeatCount="indefinite"/></circle></g>
<g class="up" style="animation-delay:0.46s">
<rect x="15" y="180" width="270" height="150" rx="18" fill="#FFFFFF" stroke="#E6E1D3" stroke-width="1.5"/>
<rect x="37" y="180" width="40" height="3" fill="url(#gold)"/>
<text x="37" y="218" class="mono" font-size="13" fill="#C9A227" letter-spacing="2">05</text>
<text x="37" y="252" font-size="19" font-weight="700" fill="#0A0A0A">CRM &amp; Funis</text>
<text x="37" y="280" font-size="14" fill="#6B6B6B">pipeline, roteamento e</text>
<text x="37" y="300" font-size="14" fill="#6B6B6B">SLA automáticos</text>
<circle cx="259" cy="212" r="4" fill="#C9A227"><animate attributeName="opacity" values=".15;1;.15" dur="3.2s" begin="1.6s" repeatCount="indefinite"/></circle></g>
<g class="up" style="animation-delay:0.55s">
<rect x="305" y="180" width="270" height="150" rx="18" fill="#0A0A0A" stroke="#0A0A0A" stroke-width="1.5"/>
<rect x="327" y="180" width="40" height="3" fill="url(#gold)"/>
<text x="327" y="218" class="mono" font-size="13" fill="#C9A227" letter-spacing="2">06</text>
<text x="327" y="252" font-size="19" font-weight="700" fill="#FFFFFF">Agentes de IA</text>
<text x="327" y="280" font-size="14" fill="#B5B5B5">Claude Code criando e</text>
<text x="327" y="300" font-size="14" fill="#B5B5B5">mantendo automações</text>
<circle cx="549" cy="212" r="4" fill="#C9A227"><animate attributeName="opacity" values=".15;1;.15" dur="3.2s" begin="2.0s" repeatCount="indefinite"/></circle></g>
<g class="up" style="animation-delay:0.64s">
<rect x="595" y="180" width="270" height="150" rx="18" fill="#FFFFFF" stroke="#E6E1D3" stroke-width="1.5"/>
<rect x="617" y="180" width="40" height="3" fill="url(#gold)"/>
<text x="617" y="218" class="mono" font-size="13" fill="#C9A227" letter-spacing="2">07</text>
<text x="617" y="252" font-size="19" font-weight="700" fill="#0A0A0A">n8n &amp; no-code</text>
<text x="617" y="280" font-size="14" fill="#6B6B6B">fluxos visuais ligando</text>
<text x="617" y="300" font-size="14" fill="#6B6B6B">qualquer ferramenta</text>
<circle cx="839" cy="212" r="4" fill="#C9A227"><animate attributeName="opacity" values=".15;1;.15" dur="3.2s" begin="2.4s" repeatCount="indefinite"/></circle></g>
<g class="up" style="animation-delay:0.73s">
<rect x="885" y="180" width="270" height="150" rx="18" fill="#FFFFFF" stroke="#E6E1D3" stroke-width="1.5"/>
<rect x="907" y="180" width="40" height="3" fill="url(#gold)"/>
<text x="907" y="218" class="mono" font-size="13" fill="#C9A227" letter-spacing="2">08</text>
<text x="907" y="252" font-size="19" font-weight="700" fill="#0A0A0A">Dados &amp; Dashboards</text>
<text x="907" y="280" font-size="14" fill="#6B6B6B">origem, métricas e</text>
<text x="907" y="300" font-size="14" fill="#6B6B6B">relatórios automáticos</text>
<circle cx="1129" cy="212" r="4" fill="#C9A227"><animate attributeName="opacity" values=".15;1;.15" dur="3.2s" begin="2.8s" repeatCount="indefinite"/></circle></g>
</svg>